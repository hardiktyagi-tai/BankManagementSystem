services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: bms-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Pass1"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - bms-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Pass1' -No -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Pass1' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: bms-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5000"
      DB_HOST: db
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=BankManagementSystem;User Id=sa;Password=YourStrong!Pass1;MultipleActiveResultSets=true;TrustServerCertificate=True"
    ports:
      - "5001:5000"

volumes:
  bms-mssql-data:
